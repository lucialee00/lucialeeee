<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나우영어 친구들의 English Quiz ✨</title>
  <style>
    :root {
      --pri: #4f46e5; --pri-light: #eef2ff; --pri-dark: #3730a3;
      --pur: #7c3aed; --pur-light: #f5f3ff;
      --ok: #16a34a;  --ok-light: #dcfce7;
      --err: #dc2626; --err-light: #fee2e2;
      --warn-light: #fef3c7;
      --gray: #6b7280; --gray-light: #f3f4f6;
      --border: #e5e7eb; --card: #fff; --bg: #f9fafb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: #111827; min-height: 100vh; }

    /* ── HEADER ── */
    header { background: linear-gradient(135deg,#4f46e5,#7c3aed); color:#fff; padding:28px 24px 22px; text-align:center; }
    header h1 { font-size:1.6rem; font-weight:700; }
    header p  { margin-top:6px; opacity:.85; font-size:.92rem; }

    /* ── UNIT TABS ── */
    .unit-nav { display:flex; justify-content:center; gap:10px; padding:14px 16px; background:#fff; border-bottom:1px solid var(--border); flex-wrap:wrap; }
    .utab { padding:8px 22px; border-radius:999px; border:2px solid var(--pri); background:#fff; color:var(--pri); font-weight:600; cursor:pointer; font-size:.88rem; transition:all .15s; }
    .utab.active,.utab:hover { background:var(--pri); color:#fff; }

    /* ── LAYOUT ── */
    main { max-width:880px; margin:0 auto; padding:22px 16px 60px; }
    .unit { display:none; } .unit.active { display:block; }

    /* ── SUB TABS ── */
    .sub-nav { display:flex; gap:6px; background:#fff; border:1px solid var(--border); border-radius:12px; padding:6px; margin-bottom:20px; }
    .stab { flex:1; padding:10px; border-radius:8px; border:none; background:transparent; color:var(--gray); font-weight:600; cursor:pointer; font-size:.9rem; transition:all .15s; }
    .stab.active { background:var(--pri); color:#fff; }
    .stab:hover:not(.active) { background:var(--gray-light); color:#374151; }

    /* ── SECTION ── */
    .section { display:none; } .section.active { display:block; }

    /* ── CONTROLS BAR ── */
    .controls { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
    .btn { padding:9px 20px; border-radius:8px; border:none; font-size:.88rem; font-weight:600; cursor:pointer; transition:opacity .15s; }
    .btn:hover { opacity:.85; }
    .btn-pri  { background:var(--pri); color:#fff; }
    .btn-sec  { background:var(--gray-light); color:#374151; border:1px solid var(--border); }
    .btn-warn { background:var(--warn-light); color:#92400e; border:1px solid #fde68a; }

    /* ── SCORE ── */
    .score-box { background:#fff; border:2px solid var(--pri); border-radius:12px; padding:14px 20px; margin-bottom:20px; font-weight:600; color:var(--pri); text-align:center; display:none; }
    .score-box span { font-size:1.3rem; }

    /* ── WORD ORDER CARD ── */
    .wcard { background:#fff; border:1px solid var(--border); border-radius:12px; padding:18px 20px; margin-bottom:16px; transition:box-shadow .2s; }
    .wcard:hover { box-shadow:0 2px 10px rgba(0,0,0,.07); }
    .wcard.title-card { border-left:4px solid var(--pri); }
    .q-num { font-size:.74rem; font-weight:700; color:var(--pri); letter-spacing:.5px; margin-bottom:5px; }
    .q-ko  { font-size:.94rem; color:#374151; line-height:1.55; margin-bottom:12px; }

    /* chip areas */
    .area-label { font-size:.72rem; font-weight:700; color:var(--gray); letter-spacing:.5px; text-transform:uppercase; margin-bottom:5px; }
    .word-bank {
      min-height:46px; background:var(--pri-light); border-radius:8px;
      padding:8px; display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;
    }
    .answer-area {
      min-height:46px; background:var(--gray-light);
      border:2px dashed var(--border); border-radius:8px;
      padding:8px; display:flex; flex-wrap:wrap; gap:6px;
      margin-bottom:12px; transition:border-color .15s, background .15s;
    }
    .answer-area.filled  { border-style:solid; border-color:#d1d5db; }
    .answer-area.correct { background:var(--ok-light); border:2px solid var(--ok); }
    .answer-area.wrong   { background:var(--err-light); border:2px solid var(--err); }
    .placeholder { color:#9ca3af; font-size:.84rem; align-self:center; padding:2px 4px; }

    /* chips */
    .chip {
      padding:6px 12px; border-radius:6px; border:none;
      font-size:.87rem; font-family:inherit; cursor:pointer;
      font-weight:500; transition:all .12s; user-select:none; line-height:1.4;
    }
    .bank-chip {
      background:#fff; color:var(--pri-dark);
      border:1.5px solid #c7d2fe; box-shadow:0 1px 3px rgba(0,0,0,.07);
    }
    .bank-chip:hover { background:var(--pri); color:#fff; border-color:var(--pri); transform:translateY(-1px); }
    .ans-chip  { background:var(--pri); color:#fff; border:1.5px solid var(--pri); }
    .ans-chip:hover { background:var(--err); border-color:var(--err); }
    .ans-chip::after { content:' ×'; opacity:.65; font-size:.75rem; }

    /* card bottom */
    .card-btns { display:flex; gap:8px; }
    .chk-btn { padding:8px 18px; background:var(--pri); color:#fff; border:none; border-radius:7px; font-size:.85rem; font-weight:600; cursor:pointer; transition:opacity .15s; }
    .chk-btn:hover { opacity:.88; }
    .clr-btn { padding:8px 14px; background:var(--gray-light); color:var(--gray); border:1px solid var(--border); border-radius:7px; font-size:.85rem; font-weight:600; cursor:pointer; }

    .w-feedback { margin-top:8px; font-size:.83rem; font-weight:600; display:none; }
    .w-feedback.ok  { color:var(--ok); display:block; }
    .w-feedback.err { color:var(--err); display:block; }
    .w-reveal { margin-top:8px; font-size:.82rem; color:var(--ok); background:var(--ok-light); border-radius:6px; padding:8px 12px; display:none; font-family:'Courier New',monospace; }
    .w-reveal.show { display:block; }

    /* ── GRAMMAR CARD ── */
    .gcard { background:#fff; border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:16px; }
    .g-num { font-size:.74rem; font-weight:700; color:var(--pur); letter-spacing:.5px; margin-bottom:5px; }
    .g-ko  { font-size:.87rem; color:var(--gray); margin-bottom:8px; }
    .g-sent {
      font-size:.97rem; color:#111827; font-weight:500; line-height:1.7;
      padding:10px 14px; background:var(--pur-light);
      border-radius:8px; border-left:3px solid var(--pur); margin-bottom:14px;
    }
    .blank {
      display:inline-block; min-width:72px; border-bottom:2.5px solid var(--pur);
      text-align:center; color:var(--pur); font-weight:700; padding:0 4px;
    }
    .opts { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
    .opt {
      display:flex; align-items:center; gap:9px;
      padding:9px 14px; border:1.5px solid var(--border); border-radius:8px;
      cursor:pointer; font-size:.9rem; transition:all .12s; user-select:none;
    }
    .opt:hover { border-color:var(--pur); background:var(--pur-light); }
    .opt.sel   { border-color:var(--pur); background:var(--pur-light); color:#5b21b6; font-weight:600; }
    .opt.ok-opt  { border-color:var(--ok); background:var(--ok-light); color:var(--ok); font-weight:600; }
    .opt.err-opt { border-color:var(--err); background:var(--err-light); color:var(--err); font-weight:600; }
    .opt-key {
      width:24px; height:24px; border-radius:50%;
      background:var(--gray-light); display:flex; align-items:center; justify-content:center;
      font-size:.75rem; font-weight:700; flex-shrink:0;
    }
    .opt.sel .opt-key     { background:var(--pur); color:#fff; }
    .opt.ok-opt .opt-key  { background:var(--ok);  color:#fff; }
    .opt.err-opt .opt-key { background:var(--err); color:#fff; }
    .g-feedback { font-size:.83rem; font-weight:600; margin-bottom:5px; }
    .g-feedback.ok  { color:var(--ok); }
    .g-feedback.err { color:var(--err); }
    .g-expl { font-size:.82rem; color:#374151; background:var(--warn-light); border-radius:6px; padding:8px 12px; display:none; margin-top:6px; border-left:3px solid #f59e0b; }
    .g-expl.show { display:block; }

    @media(max-width:500px){
      .opts { grid-template-columns:1fr; }
      header h1 { font-size:1.25rem; }
      .utab { font-size:.78rem; padding:7px 14px; }
    }
  </style>
</head>
<body>

<header>
  <h1>나우영어 친구들을 위한 ✨ English Quiz ✨</h1>
  <p>단어를 클릭해서 문장을 완성하고, 어법 문제도 풀어봐요! 우리 같이 영어 정복하자~!</p>
</header>

<nav class="unit-nav">

    </div>
    <div id="u1-order"   class="section active"></div>
    <div id="u1-grammar" class="section"></div>
  </div>

      <button class="stab"        id="st2-grammar" onclick="switchType(2,'grammar')">어법 선택 퀴즈</button>
    </div>
    <div id="u2-order"   class="section active"></div>
    <div id="u2-grammar" class="section"></div>
  </div>
</main>

// ===================================================================
// STATE  (word order questions)
// ===================================================================
const wState = {};   // key: "u-qi"  →  { tokens, bank, selected }
const gState = {};   // key: "u-gi"  →  { chosen: number | null, checked: bool }

function initWordState(u, qi) {
  const words = wordData[u][qi].words.split(' / ');
  const tokens = words.map((text, id) => ({ id, text }));
  const bank = shuffle(tokens.map(t => t.id));
  wState[`${u}-${qi}`] = { tokens, bank, selected: [] };
}

function initGrammarState(u, gi) {
  gState[`${u}-${gi}`] = { chosen: null, checked: false };
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ===================================================================
// RENDER — WORD ORDER
// ===================================================================
function renderWordSection(u) {
  const el = document.getElementById(`u${u}-order`);
  const total = wordData[u].length;

  let html = `
    <div class="controls">
      <button class="btn btn-pri"  onclick="checkAllWord(${u})">전체 채점</button>
      <button class="btn btn-warn" onclick="revealAllWord(${u})">정답 모두 보기</button>
      <button class="btn btn-sec"  onclick="resetAllWord(${u})">초기화</button>
    </div>
    <div id="wscore${u}" class="score-box"></div>
  `;

  for (let qi = 0; qi < total; qi++) {
    initWordState(u, qi);
    const q = wordData[u][qi];
    const isTitle = q.num === 'Title';
    html += `
      <div class="wcard${isTitle ? ' title-card' : ''}" id="wcard-${u}-${qi}">
        <div class="q-num">[${q.num}]</div>
        <div class="q-ko">${q.ko}</div>
        <div class="area-label">단어 뱅크 (클릭하여 선택)</div>
        <div class="word-bank"  id="bank-${u}-${qi}"></div>
        <div class="area-label">내 답안 (클릭하면 취소)</div>
        <div class="answer-area" id="ans-${u}-${qi}">
          <span class="placeholder">단어를 클릭하여 여기에 채워보세요</span>
        </div>
        <div class="card-btns">
          <button class="chk-btn" onclick="checkWordQ(${u},${qi})">확인</button>
          <button class="clr-btn" onclick="clearWordQ(${u},${qi})">초기화</button>
        </div>
        <div class="w-feedback" id="wfb-${u}-${qi}"></div>
        <div class="w-reveal"   id="wrev-${u}-${qi}">정답: ${q.answer}</div>
      </div>
    `;
  }
  el.innerHTML = html;

  // draw initial chips
  for (let qi = 0; qi < total; qi++) drawWordChips(u, qi);
}

function drawWordChips(u, qi) {
  const s = wState[`${u}-${qi}`];

  // bank
  const bankEl = document.getElementById(`bank-${u}-${qi}`);
  bankEl.innerHTML = s.bank.length
    ? s.bank.map(id =>
        `<button class="chip bank-chip" onclick="selectChip(${u},${qi},${id})">${esc(s.tokens[id].text)}</button>`
      ).join('')
    : '<span style="color:#9ca3af;font-size:.83rem;padding:4px 6px">모든 단어를 사용했습니다</span>';

  // answer
  const ansEl = document.getElementById(`ans-${u}-${qi}`);
  if (s.selected.length === 0) {
    ansEl.innerHTML = '<span class="placeholder">단어를 클릭하여 여기에 채워보세요</span>';
    ansEl.className = 'answer-area';
  } else {
    ansEl.innerHTML = s.selected.map(id =>
      `<button class="chip ans-chip" onclick="deselectChip(${u},${qi},${id})">${esc(s.tokens[id].text)}</button>`
    ).join('');
    ansEl.className = 'answer-area filled';
  }
}

function selectChip(u, qi, id) {
  const s = wState[`${u}-${qi}`];
  s.bank = s.bank.filter(x => x !== id);
  s.selected.push(id);
  drawWordChips(u, qi);
  // clear feedback
  document.getElementById(`wfb-${u}-${qi}`).className = 'w-feedback';
  document.getElementById(`wfb-${u}-${qi}`).textContent = '';
  document.getElementById(`ans-${u}-${qi}`).classList.remove('correct','wrong');
}

function deselectChip(u, qi, id) {
  const s = wState[`${u}-${qi}`];
  s.selected = s.selected.filter(x => x !== id);
  s.bank.push(id);
  drawWordChips(u, qi);
  document.getElementById(`wfb-${u}-${qi}`).className = 'w-feedback';
  document.getElementById(`ans-${u}-${qi}`).classList.remove('correct','wrong');
}

function checkWordQ(u, qi) {
  const s   = wState[`${u}-${qi}`];
  const fb  = document.getElementById(`wfb-${u}-${qi}`);
  const ans = document.getElementById(`ans-${u}-${qi}`);
  if (!s.selected.length) return;
  const given   = s.selected.map(id => s.tokens[id].text).join(' ');
  const correct = wordData[u][qi].answer;
  if (norm(given) === norm(correct)) {
    fb.className = 'w-feedback ok';
    fb.textContent = '정답입니다!';
    ans.classList.remove('wrong'); ans.classList.add('correct');
  } else {
    fb.className = 'w-feedback err';
    fb.textContent = '다시 확인해 보세요.';
    ans.classList.remove('correct'); ans.classList.add('wrong');
  }
}

function clearWordQ(u, qi) {
  initWordState(u, qi);
  drawWordChips(u, qi);
  document.getElementById(`wfb-${u}-${qi}`).className = 'w-feedback';
  document.getElementById(`wfb-${u}-${qi}`).textContent = '';
  document.getElementById(`ans-${u}-${qi}`).classList.remove('correct','wrong','filled');
  document.getElementById(`wrev-${u}-${qi}`).classList.remove('show');
}

function checkAllWord(u) {
  const total = wordData[u].length;
  let correct = 0, answered = 0;
  for (let qi = 0; qi < total; qi++) {
    const s = wState[`${u}-${qi}`];
    if (s.selected.length) {
      answered++;
      checkWordQ(u, qi);
      const given = s.selected.map(id => s.tokens[id].text).join(' ');
      if (norm(given) === norm(wordData[u][qi].answer)) correct++;
    }
  }
  const box = document.getElementById(`wscore${u}`);
  box.style.display = 'block';
  box.innerHTML = answered === 0
    ? '아직 입력한 답이 없습니다.'
    : `채점 결과: <span>${correct} / ${answered}</span>문제 정답 (전체 ${total}문제)`;
}

function revealAllWord(u) {
  for (let qi = 0; qi < wordData[u].length; qi++)
    document.getElementById(`wrev-${u}-${qi}`).classList.add('show');
}

function resetAllWord(u) {
  for (let qi = 0; qi < wordData[u].length; qi++) clearWordQ(u, qi);
  const box = document.getElementById(`wscore${u}`);
  box.style.display = 'none';
}

// ===================================================================
// RENDER — GRAMMAR
// ===================================================================
function renderGrammarSection(u) {
  const el = document.getElementById(`u${u}-grammar`);
  const qs = grammarData[u];

  let html = `
    <div class="controls">
      <button class="btn btn-pri"  onclick="checkAllGrammar(${u})">전체 채점</button>
      <button class="btn btn-warn" onclick="revealAllGrammar(${u})">해설 모두 보기</button>
      <button class="btn btn-sec"  onclick="resetAllGrammar(${u})">초기화</button>
    </div>
    <div id="gscore${u}" class="score-box"></div>
  `;

  qs.forEach((q, gi) => {
    initGrammarState(u, gi);
    const sentHtml = q.sent.replace('___', '<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
    const keys = ['A', 'B', 'C', 'D'];
    const optsHtml = q.opts.map((opt, oi) => `
      <label class="opt" id="gopt-${u}-${gi}-${oi}" onclick="chooseOpt(${u},${gi},${oi})">
        <span class="opt-key">${keys[oi]}</span>
        ${esc(opt)}
      </label>
    `).join('');

    html += `
      <div class="gcard" id="gcard-${u}-${gi}">
        <div class="g-num">문제 ${gi + 1}</div>
        <div class="g-ko">${q.ko}</div>
        <div class="g-sent">${sentHtml}</div>
        <div class="opts">${optsHtml}</div>
        <div class="card-btns">
          <button class="chk-btn" onclick="checkGrammarQ(${u},${gi})">확인</button>
          <button class="clr-btn" onclick="resetGrammarQ(${u},${gi})">초기화</button>
        </div>
        <div class="g-feedback" id="gfb-${u}-${gi}"></div>
        <div class="g-expl"     id="gexpl-${u}-${gi}">${q.expl}</div>
      </div>
    `;
  });

  el.innerHTML = html;
}

function chooseOpt(u, gi, oi) {
  const s = gState[`${u}-${gi}`];
  if (s.checked) return;
  s.chosen = oi;
  const keys = ['A','B','C','D'];
  grammarData[u][gi].opts.forEach((_, i) => {
    const lbl = document.getElementById(`gopt-${u}-${gi}-${i}`);
    lbl.className = 'opt' + (i === oi ? ' sel' : '');
  });
}

function checkGrammarQ(u, gi) {
  const s = gState[`${u}-${gi}`];
  if (s.chosen === null) return;
  s.checked = true;
  const q  = grammarData[u][gi];
  const fb = document.getElementById(`gfb-${u}-${gi}`);
  const ex = document.getElementById(`gexpl-${u}-${gi}`);
  q.opts.forEach((_, i) => {
    const lbl = document.getElementById(`gopt-${u}-${gi}-${i}`);
    if (i === q.ans) {
      lbl.className = 'opt ok-opt';
    } else if (i === s.chosen && i !== q.ans) {
      lbl.className = 'opt err-opt';
    } else {
      lbl.className = 'opt';
    }
  });
  if (s.chosen === q.ans) {
    fb.className = 'g-feedback ok';
    fb.textContent = '정답입니다!';
  } else {
    fb.className = 'g-feedback err';
    fb.textContent = `오답입니다. 정답은 ${['A','B','C','D'][q.ans]}. ${q.opts[q.ans]}`;
  }
  ex.classList.add('show');
}

function resetGrammarQ(u, gi) {
  initGrammarState(u, gi);
  grammarData[u][gi].opts.forEach((_, i) => {
    document.getElementById(`gopt-${u}-${gi}-${i}`).className = 'opt';
  });
  const fb = document.getElementById(`gfb-${u}-${gi}`);
  fb.className = 'g-feedback'; fb.textContent = '';
  document.getElementById(`gexpl-${u}-${gi}`).classList.remove('show');
}

function checkAllGrammar(u) {
  const qs = grammarData[u];
  let correct = 0, answered = 0;
  qs.forEach((_, gi) => {
    const s = gState[`${u}-${gi}`];
    if (s.chosen !== null) {
      answered++;
      checkGrammarQ(u, gi);
      if (s.chosen === qs[gi].ans) correct++;
    }
  });
  const box = document.getElementById(`gscore${u}`);
  box.style.display = 'block';
  box.innerHTML = answered === 0
    ? '아직 선택한 답이 없습니다.'
    : `채점 결과: <span>${correct} / ${answered}</span>문제 정답 (전체 ${qs.length}문제)`;
}

function revealAllGrammar(u) {
  grammarData[u].forEach((_, gi) => {
    const s = gState[`${u}-${gi}`];
    if (!s.checked) {
      // mark correct answer green without penalizing
      grammarData[u][gi].opts.forEach((__, i) => {
        document.getElementById(`gopt-${u}-${gi}-${i}`).className =
          i === grammarData[u][gi].ans ? 'opt ok-opt' : 'opt';
      });
    }
    document.getElementById(`gexpl-${u}-${gi}`).classList.add('show');
  });
}

function resetAllGrammar(u) {
  grammarData[u].forEach((_, gi) => resetGrammarQ(u, gi));
  const box = document.getElementById(`gscore${u}`);
  box.style.display = 'none';
}

// ===================================================================
// TAB SWITCHING
// ===================================================================
function switchUnit(u) {
  document.querySelectorAll('.unit').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.utab').forEach(el => el.classList.remove('active'));
  document.getElementById(`unit${u}`).classList.add('active');
  document.querySelectorAll('.utab')[u - 1].classList.add('active');
}

function switchType(u, type) {
  ['order','grammar'].forEach(t => {
    document.getElementById(`u${u}-${t}`).classList.toggle('active', t === type);
    document.getElementById(`st${u}-${t}`).classList.toggle('active', t === type);
  });
}

// ===================================================================
// HELPERS
// ===================================================================
function norm(s) {
  return s.trim().replace(/\s+/g,' ').toLowerCase().replace(/[""]/g,'"').replace(/['']/g,"'");
}
function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===================================================================
// INIT
// ===================================================================
renderWordSection(1);
renderWordSection(2);
renderGrammarSection(1);
renderGrammarSection(2);

// add stab ids after render
document.getElementById('st1-order').id   = 'st1-order';
document.getElementById('st1-grammar').id = 'st1-grammar';
document.getElementById('st2-order').id   = 'st2-order';
document.getElementById('st2-grammar').id = 'st2-grammar';
